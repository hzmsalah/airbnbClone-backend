services:
  web:
    build: ./Django-Airbnb
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./Django-Airbnb:/usr/src/airbnb_backend
    ports:
      - "8000:8000"
    env_file:
      - ./.env.dev
    depends_on:
      - db

  db:
    image: postgres:16
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_USER=postgresuser
      - POSTGRES_PASSWORD=postgrespassword
      - POSTGRES_DB=airbnb

volumes:
  postgres_data:
